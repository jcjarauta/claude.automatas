[project]
name = "escribano"
version = "0.1.0"
description = "Herramienta para diseñar y fabricar máquinas mecánicas programables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "shapely>=2.0",
    "pydantic>=2.9",
    "ezdxf>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "compile", "emit", "api"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PT",   # pytest style
    "PTH",  # usar pathlib
    "NPY",  # numpy
    "ANN",  # anotaciones de tipo
    "RUF",
]
ignore = [
    "ANN401",  # Any explícito, a veces necesario en bordes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["ANN"]
# N818 pide que las excepciones acaben en "Error". En castellano la palabra va
# delante (ErrorDeDominio), que comunica lo mismo y se lee mejor. Decisión
# consciente, no descuido.
"core/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["core", "compile", "emit", "api"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["scipy.*", "shapely.*", "ezdxf.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "core: tests del núcleo puro, rápidos y sin E/S",
    "golden: comparación byte a byte contra salidas de referencia",
    "bench: contraste contra datos medidos en el banco de ensayo",
    "slow: tarda más de un segundo",
]
